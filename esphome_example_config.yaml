esphome:
  name: xiao-wio-home-control
  friendly_name: XIAO Wio Home Control

esp32:
  board: seeed_xiao_esp32s3
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source:
      type: local
      path: components

spi:
  clk_pin: GPIO36
  miso_pin: GPIO37
  mosi_pin: GPIO35

home_io_control:
  id: io_radio

  # XIAO ESP32-S3 + Wio-SX1262 B2B
  cs_pin: GPIO7
  rst_pin: GPIO4
  dio1_pin: GPIO1
  busy_pin: GPIO2

  # Wio-SX1262 PWR_EN
  # home_io_control drives fem_en_pin HIGH during radio initialization.
  fem_en_pin: GPIO5

  radio_type: sx1262

  # Wio-SX1262 uses a 1.8 V TCXO.
  tcxo_voltage: 1_8V

  tx_power: 17

  node_id: "A1B2C3"
  system_key: "00112233445566778899AABBCCDDEEFF"

button:
  - platform: home_io_control
    name: "Discover & Pair"
    home_io_control_id: io_radio

